<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f4efe7" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3Cmask id='m'%3E%3Crect width='40' height='40' rx='11.5' fill='%23fff'/%3E%3Cg stroke='%23000' stroke-width='4.4' stroke-linecap='round' stroke-linejoin='round' fill='none'%3E%3Cpath d='M10.4 29.6V13.2l7.1 6.9'/%3E%3Cpath d='M29.6 29.6V13.2l-7.1 6.9'/%3E%3C/g%3E%3Ccircle cx='20' cy='24.2' r='4.5' fill='%23000'/%3E%3C/mask%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0.35' y2='1'%3E%3Cstop offset='0%25' stop-color='%237c9a80'/%3E%3Cstop offset='100%25' stop-color='%234e6c51'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='11.5' fill='url(%23g)' mask='url(%23m)'/%3E%3C/svg%3E"
    />
    <script>
      // Resolve the theme before first paint — otherwise a dark-mode user
      // gets a flash of beige every time the app loads.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('money-map-os/v1') || '{}');
          var choice = (s.settings && s.settings.theme) || 'system';
          var dark = choice === 'dark' || (choice === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name=theme-color]')
            .setAttribute('content', dark ? '#17150f' : '#f4efe7');
        } catch (e) {}
      })();
    </script>
    <title>Money Map</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
